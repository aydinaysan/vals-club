<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07100b">
<title>{% block title %}VALS CLUB{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static',filename='manifest.json') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}">
</head><body>
<header><a class="brand" href="{{ url_for('home') }}">VALS<span>CLUB</span></a>
<nav>{% if user %}<a href="{{ url_for('home') }}">Ana Sayfa</a><a href="{{ url_for('leaderboard') }}">Liderlik</a>{% if user.email=='admin@valsclub.local' %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}<a href="{{ url_for('logout') }}">Çıkış</a>{% endif %}</nav></header>
<main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
